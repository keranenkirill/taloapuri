[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taloapuri"
version = "0.0.1"
description = "Taloyhtiöiden digitaalinen avustaja"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "tzdata>=2024.2",  # zoneinfo Windowsilla (Europe/Helsinki)
    "defusedxml>=0.7",  # turvallinen XML-jäsennys (Finlex Akoma Ntoso)
    "anthropic>=1.14",
    "pillow>=11.0",  # kuvien uudelleenkoodaus ja metatietojen poisto
    "pillow-heif>=0.20",  # iPhonen HEIC-kuvat
    "pypdf>=5.0",  # PDF-tekstin poiminta (pöytäkirjat, tarjoukset)
    "python-dotenv>=1.0",  # .env luetaan automaattisesti (sovellus, alembic, skriptit)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "types-defusedxml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taloapuri = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: vaatii PostgreSQL-testitietokannan (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # assert on sallittu testeissä

[tool.ruff.lint.per-file-ignores]
# Migraatioiden ja seed-skriptin SQL kootaan vain koodin vakioista, ei käyttäjän syötteestä.
"migrations/**" = ["E501", "S608"]
"scripts/**" = ["S608"]
"tests/**" = ["S105", "S106", "S608", "E501"]  # testien SQL ja merkkijonot koostetaan vakioista

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
